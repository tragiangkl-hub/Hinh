    <style>
        /* === CSS STYLES === */
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg: #F3F4F6;
            --text: #1F2937;
            --text-light: #6B7280;
            --white: #FFFFFF;
            --border: #E5E7EB;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .timer {
            font-weight: bold;
            color: var(--danger);
            font-size: 1.2rem;
        }

        .progress-container {
            width: 100%;
            background: var(--border);
            border-radius: 8px;
            height: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Navigation Grid */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
            background: var(--white);
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .nav-btn {
            padding: 8px 4px;
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }

        .nav-btn:hover { background: var(--bg); }
        .nav-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .nav-btn.answered { background: var(--success); color: white; border-color: var(--success); }
        .nav-btn.wrong { background: var(--danger); color: white; border-color: var(--danger); }

        /* Question Card */
        .question-card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: none;
        }

        .question-card.active { display: block; }

        .question-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .question-text {
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* Multiple Choice Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 15px;
            border: 2px solid var(--border);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(.locked) { border-color: var(--primary); background: #EEF2FF; }
        .option-btn.correct { border-color: var(--success); background: #D1FAE5; color: #065F46; }
        .option-btn.wrong { border-color: var(--danger); background: #FEE2E2; color: #991B1B; }
        .option-btn.locked { cursor: not-allowed; opacity: 0.8; }

        /* True/False Table */
        .tf-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        .tf-table th, .tf-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: center;
        }

        .tf-table td.text-cell { text-align: left; }

        .tf-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .tf-btn:hover:not(.locked) { background: var(--bg); }
        .tf-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .tf-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .tf-btn.wrong { background: var(--danger); color: white; border-color: var(--danger); }
        .tf-btn.locked { cursor: not-allowed; }

        /* Short Answer Input */
        .short-answer-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .short-answer-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
        }

        .short-answer-input input:focus { outline: none; border-color: var(--primary); }

        /* Solution Box */
        .solution-box {
            margin-top: 15px;
            padding: 15px;
            background: #F8FAFC;
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            display: none;
        }

        .solution-box.show { display: block; }

        .solution-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: #EEF2FF; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Result Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-overlay.show { display: flex; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .result-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; align-items: flex-start; }
            .actions { flex-direction: column; }
            .tf-table th, .tf-table td { padding: 5px; font-size: 0.85rem; }
        }
    </style>
</head>

<div class="container">
    <!-- Header -->

        <h1>ĐỀ LUYỆN TẬP: ĐƯỜNG THẲNG VÀ MẶT PHẲNG TRONG KHÔNG GIAN</h1>
        <div class="stats-bar">
            <span id="timeLeft" class="timer">60:00</span>
            <span>Đã làm: <strong id="answeredCount">0</strong>/22</span>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <!-- Navigation Grid -->
    <div class="nav-grid" id="navGrid"></div>

    <!-- Question Container -->
    <div id="questionContainer"></div>

    <!-- Action Buttons -->
    <div class="actions">
        <button class="btn btn-outline" id="prevBtn" onclick="changeQuestion(-1)">Câu trước</button>
        <button class="btn btn-warning" onclick="submitExam()">Nộp bài</button>
        <button class="btn btn-outline" onclick="resetExam()">Làm lại</button>
        <button class="btn btn-primary" id="nextBtn" onclick="changeQuestion(1)">Câu tiếp theo</button>
    </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-content">
        <h2>KẾT QUẢ BÀI THI</h2>
        <div class="result-score" id="finalScore">0/10</div>
        <p id="resultStats"></p>
        <p id="resultTime"></p>
        <button class="btn btn-primary" onclick="closeModal()" style="margin-top:20px; width:100%;">Xem lại bài làm</button>
        <button class="btn btn-outline" onclick="resetExam()" style="margin-top:10px; width:100%;">Làm lại bài</button>
    </div>
</div>

// Biến trạng thái toàn cục
let currentIndex = 0;
let userAnswers = new Array(questionsData.length).fill(null);
let questionStates = new Array(questionsData.length).fill(null); // null, 'correct', 'wrong'
let timerInterval;
let timeLeft = 60 * 60; // 60 phút tính bằng giây
let isSubmitted = false;

// Khởi tạo ứng dụng
function init() {
    shuffleOptions();
    renderNavGrid();
    renderQuestion(0);
    startTimer();
    updateStats();
}

// Xáo trộn đáp án cho câu hỏi loại 1
function shuffleOptions() {
    questionsData.forEach(q => {
        if (q.type === 1) {
            let indices = [0, 1, 2, 3];
            // Fisher-Yates Shuffle
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            q.shuffledOptions = indices.map(i => q.options[i]);
            q.shuffledCorrectIndex = indices.indexOf(q.correctOption);
        }
    });
}

// Bắt đầu đồng hồ đếm ngược
function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitExam();
        }
        updateTimerDisplay();
    }, 1000);
}

function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timeLeft').innerText = `${m}:${s}`;
}

// Cập nhật thanh tiến trình và số câu đã làm
function updateStats() {
    const answeredCount = userAnswers.filter(a => a !== null).length;
    document.getElementById('answeredCount').innerText = answeredCount;
    
    const progress = (answeredCount / questionsData.length) * 100;
    document.getElementById('progressBar').style.width = `${progress}%`;

    // Cập nhật navigation grid
    const navBtns = document.querySelectorAll('.nav-btn');
    navBtns.forEach((btn, idx) => {
        btn.classList.remove('active', 'answered', 'wrong');
        if (idx === currentIndex) btn.classList.add('active');
        if (userAnswers[idx] !== null) {
            if(questionStates[idx] === 'wrong') btn.classList.add('wrong');
            else btn.classList.add('answered');
        }
    });
}

// Render bảng điều hướng
function renderNavGrid() {
    const grid = document.getElementById('navGrid');
    grid.innerHTML = '';
    questionsData.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.innerText = q.id;
        btn.onclick = () => renderQuestion(idx);
        grid.appendChild(btn);
    });
}

// Render câu hỏi
function renderQuestion(index) {
    currentIndex = index;
    const q = questionsData[index];
    const container = document.getElementById('questionContainer');
    
    let html = `<div class="question-card active" id="q-${q.id}">`;
    html += `<div class="question-title">Câu ${q.id} (${q.points} điểm)</div>`;
    html += `<div class="question-text">${q.text}</div>`;

    const isLocked = userAnswers[index] !== null;

    if (q.type === 1) {
        html += `<div class="options-grid">`;
        const labels = ['A', 'B', 'C', 'D'];
        q.shuffledOptions.forEach((opt, optIdx) => {
            let classes = "option-btn";
            if (isLocked) {
                classes += " locked";
                if (optIdx === q.shuffledCorrectIndex) classes += " correct";
                else if (userAnswers[index] === optIdx && optIdx !== q.shuffledCorrectIndex) classes += " wrong";
            }
            html += `<button class="${classes}" onclick="selectOption(${index}, ${optIdx})" ${isLocked ? 'disabled' : ''}>
                        <strong>${labels[optIdx]}.</strong>&nbsp;${opt}
                     </button>`;
        });
        html += `</div>`;
    } 
    else if (q.type === 2) {
        html += `<table class="tf-table">
                    <thead><tr><th></th><th>Đúng</th><th>Sai</th></tr></thead><tbody>`;
        q.statements.forEach((st, stIdx) => {
            const isStLocked = userAnswers[index] !== null && userAnswers[index][stIdx] !== undefined;
            const userAns = isStLocked ? userAnswers[index][stIdx] : null;
            let trueClass = "tf-btn", falseClass = "tf-btn";
            
            if (isStLocked) {
                trueClass += " locked";
                falseClass += " locked";
                if (st.correct === true) trueClass += " correct";
                else trueClass += " wrong";
                if (st.correct === false) falseClass += " correct";
                else falseClass += " wrong";
                if (userAns === true) trueClass += " selected";
                if (userAns === false) falseClass += " selected";
            }

            html += `<tr>
                        <td class="text-cell">${st.text}</td>
                        <td><button class="${trueClass}" onclick="selectTF(${index}, ${stIdx}, true)" ${isStLocked ? 'disabled' : ''}>Đúng</button></td>
                        <td><button class="${falseClass}" onclick="selectTF(${index}, ${stIdx}, false)" ${isStLocked ? 'disabled' : ''}>Sai</button></td>
                     </tr>`;
        });
        html += `</tbody></table>`;
        if (!isLocked) html += `<button class="btn btn-primary" onclick="checkTF(${index})" style="margin-top:10px; width:100%;">Kiểm tra</button>`;
    } 
    else if (q.type === 3) {
        html += `<div class="short-answer-input">
                    <input type="text" id="shortInput-${index}" placeholder="Nhập đáp án số..." ${isLocked ? 'disabled value="'+userAnswers[index]+'"' : ''}>
                    <button class="btn btn-primary" onclick="checkShortAnswer(${index})" ${isLocked ? 'disabled' : ''}>Kiểm tra</button>
                 </div>`;
    }

    // Nút xem lời giải
    if (isLocked) {
        html += `<button class="btn btn-outline" onclick="toggleSolution(${index})" style="margin-top:15px; width:100%;">Xem lời giải</button>`;
        html += `<div class="solution-box" id="solution-${index}">
                    <div class="solution-title">Lời giải chi tiết:</div>
                    ${q.solution}
                 </div>`;
    }

    html += `</div>`;
    container.innerHTML = html;
    updateStats();
    MathJax.typesetPromise(); // Render lại công thức Toán học
}

// Xử lý chọn đáp án Part 1
function selectOption(qIdx, optIdx) {
    if (userAnswers[qIdx] !== null) return;
    const q = questionsData[qIdx];
    userAnswers[qIdx] = optIdx;
    
    if (optIdx === q.shuffledCorrectIndex) {
        questionStates[qIdx] = 'correct';
    } else {
        questionStates[qIdx] = 'wrong';
    }
    
    renderQuestion(qIdx);
    autoNextQuestion();
}

// Xử lý chọn Đúng/Sai Part 2
function selectTF(qIdx, stIdx, val) {
    if (userAnswers[qIdx] !== null) return;
    if (!userAnswers[qIdx]) userAnswers[qIdx] = {};
    userAnswers[qIdx][stIdx] = val;
    
    // Tạm thời render lại để hiện nút đã bấm
    const q = questionsData[qIdx];
    const table = document.getElementById(`q-${q.id}`).querySelector('.tf-table');
    const rows = table.querySelectorAll('tbody tr');
    
    const trueBtn = rows[stIdx].querySelector('td:nth-child(2) button');
    const falseBtn = rows[stIdx].querySelector('td:nth-child(3) button');
    
    trueBtn.classList.remove('selected');
    falseBtn.classList.remove('selected');
    if(val === true) trueBtn.classList.add('selected');
    if(val === false) falseBtn.classList.add('selected');
}

// Kiểm tra câu Đúng/Sai
function checkTF(qIdx) {
    const q = questionsData[qIdx];
    if (!userAnswers[qIdx] || Object.keys(userAnswers[qIdx]).length < 4) {
        alert("Vui lòng chọn Đúng/Sai cho tất cả 4 ý trước khi kiểm tra!");
        return;
    }
    
    let correctCount = 0;
    q.statements.forEach((st, idx) => {
        if (userAnswers[qIdx][idx] === st.correct) correctCount++;
    });

    if (correctCount === 4) questionStates[qIdx] = 'correct';
    else questionStates[qIdx] = 'wrong';

    renderQuestion(qIdx);
    autoNextQuestion();
}

// Kiểm tra câu trả lời ngắn
function checkShortAnswer(qIdx) {
    const q = questionsData[qIdx];
    const inputEl = document.getElementById(`shortInput-${qIdx}`);
    const userVal = inputEl.value.trim().replace(',', '.'); // Chuyển dấu phẩy thành chấm
    
    if (userVal === "") {
        alert("Vui lòng nhập đáp án!");
        return;
    }

    userAnswers[qIdx] = inputEl.value; // Lưu nguyên bản gốc
    
    // Kiểm tra đáp án (chấp nhận số thực, phân số)
    const isCorrect = q.correctAnswers.some(ans => {
        if (ans.includes('/')) {
            // Nếu là phân số, kiểm tra cả giá trị thập phân và chuỗi
            const parts = ans.split('/');
            const decimalVal = parseFloat(parts[0]) / parseFloat(parts[1]);
            return userVal === ans || parseFloat(userVal) === decimalVal;
        }
        return userVal === ans || parseFloat(userVal) === parseFloat(ans);
    });

    if (isCorrect) questionStates[qIdx] = 'correct';
    else questionStates[qIdx] = 'wrong';

    renderQuestion(qIdx);
    autoNextQuestion();
}

// Tự động chuyển câu sau 1.5s
function autoNextQuestion() {
    setTimeout(() => {
        if (currentIndex < questionsData.length - 1) {
            renderQuestion(currentIndex + 1);
        }
    }, 1500);
}

// Hiển thị/ẩn lời giải
function toggleSolution(qIdx) {
    const solBox = document.getElementById(`solution-${qIdx}`);
    solBox.classList.toggle('show');
}

// Chuyển câu hỏi
function changeQuestion(step) {
    let newIndex = currentIndex + step;
    if (newIndex >= 0 && newIndex < questionsData.length) {
        renderQuestion(newIndex);
    }
}

// Tính điểm
function calculateScore() {
    let totalScore = 0;
    let correctCount = 0;
    let wrongCount = 0;

    questionsData.forEach((q, idx) => {
        if (q.type === 1) {
            if (userAnswers[idx] === q.shuffledCorrectIndex) {
                totalScore += 0.25;
                correctCount++;
            } else if (userAnswers[idx] !== null) {
                wrongCount++;
            }
        } 
        else if (q.type === 2) {
            if (userAnswers[idx]) {
                let stCorrect = 0;
                q.statements.forEach((st, stIdx) => {
                    if (userAnswers[idx][stIdx] === st.correct) stCorrect++;
                });
                if (stCorrect === 1) totalScore += 0.1;
                else if (stCorrect === 2) totalScore += 0.25;
                else if (stCorrect === 3) totalScore += 0.5;
                else if (stCorrect === 4) { totalScore += 1.0; correctCount++; }
                else wrongCount++;
            }
        } 
        else if (q.type === 3) {
            if (userAnswers[idx] !== null) {
                const userVal = userAnswers[idx].trim().replace(',', '.');
                const isCorrect = q.correctAnswers.some(ans => {
                    if (ans.includes('/')) {
                        const parts = ans.split('/');
                        const decimalVal = parseFloat(parts[0]) / parseFloat(parts[1]);
                        return userVal === ans || parseFloat(userVal) === decimalVal;
                    }
                    return userVal === ans || parseFloat(userVal) === parseFloat(ans);
                });
                if (isCorrect) {
                    totalScore += 0.5;
                    correctCount++;
                } else {
                    wrongCount++;
                }
            }
        }
    });

    return { totalScore: totalScore.toFixed(2), correctCount, wrongCount };
}

// Nộp bài
function submitExam() {
    if (isSubmitted) return;
    isSubmitted = true;
    clearInterval(timerInterval);

    const result = calculateScore();
    const timeTaken = 3600 - timeLeft;
    const m = Math.floor(timeTaken / 60);
    const s = timeTaken % 60;

    document.getElementById('finalScore').innerText = `${result.totalScore} / 10`;
    document.getElementById('resultStats').innerText = `Correct: ${result.correctCount} | Wrong: ${result.wrongCount} | Percentage: ${(result.totalScore * 10).toFixed(0)}%`;
    document.getElementById('resultTime').innerText = `Time taken: ${m}m ${s}s`;
    
    document.getElementById('resultModal').classList.add('show');
}

function closeModal() {
    document.getElementById('resultModal').classList.remove('show');
    // Mở khóa tất cả lời giải
    questionsData.forEach((q, idx) => {
        if(userAnswers[idx] === null) userAnswers[idx] = 'skipped'; // Đánh dấu chưa làm
        if(q.type === 2 && userAnswers[idx] === 'skipped') userAnswers[idx] = {0: null, 1: null, 2: null, 3: null}; // Fix lỗi null cho T/F
    });
    renderQuestion(currentIndex);
}

// Làm lại bài
function resetExam() {
    isSubmitted = false;
    userAnswers = new Array(questionsData.length).fill(null);
    questionStates = new Array(questionsData.length).fill(null);
    timeLeft = 60 * 60;
    currentIndex = 0;
    clearInterval(timerInterval);
    document.getElementById('resultModal').classList.remove('show');
    shuffleOptions();
    renderQuestion(0);
    startTimer();
    updateStats();
}

// Chạy ứng dụng
window.onload = init;
